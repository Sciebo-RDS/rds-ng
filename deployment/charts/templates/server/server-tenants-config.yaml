apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "rds.fullname" . }}-server-tenants-config
    namespace: {{ .Values.namespace }}
data:
    tenants.toml: |
        {{ range $k, $v := .Values.tenants }}
        [{{ lower $k }}]
        [{{ lower $k }}.integration]
        scheme = {{ required (printf "Missing scheme for tenant %s" $k) $v.scheme | quote }}

        {{ if eq (lower $v.scheme) "host" -}}
        [{{ lower $k }}.integration.host]
        url = {{ required (printf "Missing URL for tenant %s" $k) $v.url | quote }}
        {{- end }}

        {{ if $v.excludedConnectors }}
        [{{ lower $k }}.connectors]
        excluded_connectors = {{ toJson $v.excludedConnectors }}
        {{- end }}

        {{ if $v.oauth2 -}}
        [{{ lower $k }}.authorization.oauth2]
        client_id = {{ required (printf "Missing OAuth2 client ID for tenant %s" $k) $v.oauth2.clientId | quote }}
        {{- end }}
        {{ end }}
