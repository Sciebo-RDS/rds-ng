apiVersion: v1
kind: Service
metadata:
    name: {{ include "rds.fullname" . }}-frontend-service
    namespace: {{ include "rds.namespace" . }}
    labels: {{- include "rds.labels" (list . "frontend") | nindent 8 }}
spec:
    selector:
        {{- include "rds.selectorLabels" (list . "frontend") | nindent 8 }}
    ports:
        -   protocol: TCP
            port: 8000
            targetPort: 6969
