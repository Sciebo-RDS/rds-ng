# Local RDS NG+Nextcloud deployment
services:
    server:
        restart: always
        image: rds-ng/server:develop
        container_name: rds-server
        ports:
            - "4200:6969"
        volumes:
            - ./.data/bridgit:/data
        env_file:
            - ./env/server.env
            - ./local.env

    nextcloud:
        image: nextcloud:33
        container_name: nextcloud
        environment:
            OVERWRITEPROTOCOL: 'https'
            OVERWRITEHOST: 'nextcloud.dev.local'

            NEXTCLOUD_ADMIN_USER: 'admin'
            NEXTCLOUD_ADMIN_PASSWORD: 'admin'
        volumes:
            - nextcloud:/var/www/html
            - ./.data/custom_apps:/var/www/html/custom_apps
            - ../../../rds-ng-nextcloud:/var/www/html/custom_apps/rdsng

    proxy:
        image: nginx:alpine
        container_name: proxy
        ports:
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs:ro
        depends_on:
            - server
            - nextcloud

volumes:
    nextcloud:
        name: nextcloud
