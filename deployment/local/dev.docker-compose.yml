# Local RDS NG+Nextcloud deployment
services:
    # RDS NG services
    server:
        image: rds-ng/server:develop
        container_name: rds-server
        volumes:
            - type: bind
              source: ../../src
              target: /component
            - type: bind
              source: ./.data/server
              target: /data
        env_file:
            - ./env/dev.server.env
            - ./local.env

    domo:
        image: rds-ng/domo:develop
        container_name: rds-domo
        volumes:
            - type: bind
              source: ../../src
              target: /component
            - type: bind
              source: ./.data/domo
              target: /data
        environment:
            RDS_NETWORK_CLIENT_SERVER_ADDRESS: "http://rds-server:6969"
        env_file:
            - ./env/dev.domo.env
            - ./local.env

    frontend:
        image: rds-ng/frontend:develop
        container_name: rds-frontend
        volumes:
            - type: bind
              source: ../../src/frontend/src
              target: /app/frontend/src
            - type: bind
              source: ../../src/common
              target: /app/common
            - /app/common/node_modules
        environment:
            RDS_NETWORK_CLIENT_SERVER_ADDRESS: "https://nextcloud.dev.local:4200"
        env_file:
            - ./env/dev.frontend.env
            - ./local.env

    # Other services
    nextcloud:
        image: nextcloud:33
        container_name: nextcloud
        environment:
            OVERWRITEPROTOCOL: "https"
            OVERWRITEHOST: "nextcloud.dev.local"

            NEXTCLOUD_ADMIN_USER: "admin"
            NEXTCLOUD_ADMIN_PASSWORD: "admin"
        volumes:
            - nextcloud:/var/www/html
            - ./.data/custom_apps:/var/www/html/custom_apps
            - ../../../rds-ng-nextcloud:/var/www/html/custom_apps/rdsng

    proxy:
        image: nginx:alpine
        container_name: proxy
        ports:
            - "443:443"     # Nextcloud
            - "4200:4200"   # Server
            - "5500:5500"   # Domo
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/location.snippet.conf:/etc/nginx/location.snippet.conf:ro
            - ./certs:/etc/nginx/certs:ro
        depends_on:
            - server
            - domo
            - frontend
            - nextcloud

volumes:
    nextcloud:
        name: nextcloud
