events {}

http {
    # Nextcloud
    server {
        listen 443 ssl;
        server_name nextcloud.dev.local;

        ssl_certificate     /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;

        location / {
            # CORS stuff
            add_header 'Access-Control-Allow-Origin' 'https://bridgit.nextcloud.dev.local' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;

            proxy_pass http://nextcloud:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header X-Frame-Options;
            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
        }
    }

    # Frontend
    server {
        listen 443 ssl;
        server_name bridgit.nextcloud.dev.local;

        ssl_certificate     /etc/nginx/certs/local.crt;
        ssl_certificate_key /etc/nginx/certs/local.key;

        location / {
            # CORS stuff
            add_header 'Access-Control-Allow-Origin' 'https://nextcloud.dev.local' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;

            proxy_pass http://rds-frontend:6969;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header X-Frame-Options;
            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
        }
    }
}
