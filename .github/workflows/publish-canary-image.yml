name: Build and publish a container image for canary releases
on:
    push:
        branches-ignore:
            - develop
            - release
jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
            -   name: Build containers
                run: cd deployment/containers && make build
            -   name: Log in to registry
                run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            -   name: Push images
                run: |
                    components=(
                        server
                        domo
                        connector-osf
                        connector-zenodo
                        connector-stub
                        frontend
                    )
                    
                    for comp in "${components[@]}"; do
                        IMAGE_ID=ghcr.io/sciebo-rds/rds-ng-$comp
                        VERSION="${{github.ref}}"
                        VERSION=${VERSION#"refs/heads/"}
                        VERSION=${VERSION:0:3}
                        VERSION=canary-${VERSION}
                    
                        echo IMAGE_ID=$IMAGE_ID
                        echo VERSION=$VERSION
                        docker tag docker.io/rds-ng/$comp:latest $IMAGE_ID:$VERSION
                        docker push $IMAGE_ID:$VERSION
                    done
